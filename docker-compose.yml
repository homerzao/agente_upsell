# Desenvolvimento local: só Postgres + Redis (o app roda com npm run dev).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=agente_upsell
      - POSTGRES_PASSWORD=dev
      - POSTGRES_DB=agente_upsell
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata-dev:
